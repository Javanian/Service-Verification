name: Build release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: docker build --label org.opencontainers.image.revision=${{ github.sha }} -t service-proof:${{ github.sha }} .
      - run: docker save service-proof:${{ github.sha }} | gzip > service-proof.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: service-proof-container-${{ github.sha }}
          path: service-proof.tar.gz
          retention-days: 7
# Creates a downloadable image only. No registry push or deployment permissions.
