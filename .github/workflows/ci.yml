name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
        env:
          POSTGRES_DB: serviceproof_test
          POSTGRES_USER: serviceproof
          POSTGRES_PASSWORD: ci-disposable-password
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U serviceproof -d serviceproof_test'
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_PASSWORD: ci-disposable-password
      DB_USER: serviceproof
      OWNER_USERNAME: owner
      OWNER_PASSWORD: local-owner-password
      COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: scripts/verify.sh
      - name: Browser integration database
        run: PGPASSWORD="$DB_PASSWORD" psql -h localhost -U serviceproof -d serviceproof_test -c 'CREATE DATABASE serviceproof_e2e'
      - name: Start packaged application
        run: |
          DB_URL=jdbc:postgresql://localhost:5432/serviceproof_e2e java -jar backend/target/service-proof-1.0.0.jar > /tmp/service-proof.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/session >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/service-proof.log
          exit 1
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - working-directory: frontend
        env:
          BASE_URL: http://localhost:8080
        run: npm run e2e
      - name: Build runtime container
        run: docker build -t service-proof:ci .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verification-${{ github.sha }}
          path: |
            backend/target/surefire-reports
            frontend/playwright-report
            frontend/test-results
            evidence/*.png
            evidence/*.pdf
