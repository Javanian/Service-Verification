spring.application.name=Service Verification
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/serviceproof}
spring.datasource.username=${DB_USER:serviceproof}
spring.datasource.password=${DB_PASSWORD}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.error.include-message=never
server.error.include-stacktrace=never
proof.photos.max-job-bytes=${PHOTO_JOB_MAX_BYTES:104857600}
proof.photos.max-total-bytes=${PHOTO_TOTAL_MAX_BYTES:1073741824}
server.tomcat.max-http-form-post-size=16KB
server.tomcat.max-swallow-size=6MB
